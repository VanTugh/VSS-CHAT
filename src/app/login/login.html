<div class="auth-container">
    
  <!-- NỬA BÊN TRÁI -->
  <div class="auth-left">
    <div class="banner-content">
      <!-- Sửa lại đường dẫn ảnh minh họa, bỏ dấu ./ đi -->
      <img src="assets/illustration.svg" alt="VSS Illustration" class="illustration">
      <h1>Hệ thống quản lý chat đa nền tảng</h1>
      <p>Tiết kiệm thời gian tư vấn và chăm sóc khách hàng</p>
      <div class="pagination">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- NỬA BÊN PHẢI -->
  <div class="auth-right">
    
    <div class="language-selector">
      <div class="current-lang">
        <i class="fa-solid fa-globe"></i>
        <span class="text">Tiếng Việt</span>
        <i class="fa-solid fa-caret-down"></i>
      </div>
      <ul class="lang-dropdown">
        <li>Tiếng Việt</li>
        <li>Tiếng Anh</li>
      </ul>
    </div>

    <!-- FORM ĐĂNG NHẬP -->
    <div class="auth-form"> 
      <!-- Sửa lại đường dẫn ảnh logo, bỏ dấu ./ đi -->
      <img src="assets/logo.png" alt="VSS Logo" class="logo">
      <h2>Đăng nhập vào tài khoản của bạn</h2>
      
      <!-- Đổi từ action="#" sang (ngSubmit) -->
      <form (ngSubmit)="onLogin()">
        
        <!-- Hộp báo lỗi chung dùng *ngIf để tự động ẩn/hiện -->
        <div class="error-msg" *ngIf="generalError" style="text-align: center; margin-bottom: 15px; display: block;">
          {{ generalError }}
        </div>

        <div class="input-group">
  <input 
    type="text" 
    placeholder="Nhập tài khoản/email"
    [(ngModel)]="email" 
    name="email"
    [disabled]="isLocked"
    (ngModelChange)="onInputChange()">
    
  <!-- Hiển thị lỗi nếu có (dùng *ngIf) -->
  <span class="error-msg" *ngIf="emailError">{{ emailError }}</span>
</div>
        
        <div class="input-group password-wrapper">
          <!-- Thay đổi linh hoạt type password/text -->
          <input [type]="isPasswordHidden ? 'password' : 'text'" [(ngModel)]="password" name="password" placeholder="Nhập mật khẩu">
          <!-- Bắt sự kiện click để gọi hàm đổi icon -->
          <i class="fa-solid toggle-password" 
             [ngClass]="isPasswordHidden ? 'fa-eye-slash' : 'fa-eye'"
             (click)="togglePasswordVisibility()"></i>
          <span class="error-msg" *ngIf="passwordError" style="display: block;">{{ passwordError }}</span>
        </div>

        <div class="form-actions">
          <label class="remember">
            <input type="checkbox"> Lưu mật khẩu
          </label>
          <!-- Dùng routerLink thay vì href -->
          <a routerLink="/forgot-password" class="text-link">Quên mật khẩu?</a>
        </div>

        <!-- Ràng buộc trạng thái khóa nút -->
        <button type="submit" class="btn-submit" [disabled]="isLocked" [ngClass]="{'btn-disabled': isLocked}">
          Đăng nhập
        </button>
      </form>

      <p class="hint-text">Bạn chưa có tài khoản? <a routerLink="/register" class="text-link">Đăng ký</a></p>
    </div>
  </div>

</div>
