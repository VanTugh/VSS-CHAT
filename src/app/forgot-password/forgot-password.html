
  <div class="auth-container">
    
    <!-- NỬA BÊN TRÁI -->
    <div class="auth-left">
      <div class="banner-content">
        <img src="assets/illustration.svg" alt="VSS Illustration" class="illustration">
        <h1>Hệ thống quản lý chat đa nền tảng</h1>
        <p>Tiết kiệm thời gian tư vấn và chăm sóc khách hàng</p>
        <div class="pagination">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- NỬA BÊN PHẢI -->
    <div class="auth-right">
      
      <!-- MENU CHỌN NGÔN NGỮ (DROPDOWN) -->
      <div class="language-selector">
        <div class="current-lang">
          <i class="fa-solid fa-globe"></i>
          <span class="text">Tiếng Việt</span>
          <i class="fa-solid fa-caret-down"></i>
        </div>
        <ul class="lang-dropdown">
          <li>Tiếng Việt</li>
          <li>Tiếng Anh</li>
        </ul>
      </div>

      <!-- FORM QUÊN MẬT KHẨU (Có thêm class forgot-pwd-form) -->
      <div class="auth-form forgot-pwd-form"> 
        
        <!-- Header đỏ tràn viền -->
        <div class="form-header-red">
          <a routerLink="/login" class="back-btn">
            <i class="fa-solid fa-chevron-left"></i> Quay lại
          </a>
          <h3 class="header-title">Quên mật khẩu</h3>
          <div class="spacer"></div> <!-- Thẻ tàng hình để đẩy title ra chính giữa -->
        </div>

        <!-- Nội dung Form -->
        <div class="form-body">
          <img src="assets/forgot-pass.png" alt="Forgot Password" class="step-ill">
          
          <h3 class="step-title">Bạn đã quên mật khẩu?</h3>
          <p class="step-desc">Đừng lo lắng, hãy nhập tài khoản hoặc email của bạn ở dưới<br>để tìm kiếm tài khoản của bạn</p>
          
         <form action="#">
            <div class="input-group">
              <input type="text" placeholder="Nhập tài khoản/email">
              <!-- Thêm thẻ này để chứa câu chửi, mặc định tàng hình -->
              <span class="error-msg"></span>
            </div>

            <!-- Xóa sạch class btn-disabled và thuộc tính disabled đi -->
            <button type="submit" class="btn-submit">Tiếp tục</button>
          </form>


        </div>

      </div>
    </div>

  </div>
